controller:
  admin:
    username: admin

  serviceType: LoadBalancer
  servicePort: 80
  targetPort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  additionalPlugins:
    - credentials-binding:latest
    - github:latest
    - job-dsl:latest
    - authorize-project:latest

  JCasC:
    configScripts:
      build-authorization: |
        security:
          queueItemAuthenticator:
            authenticators:
              - global:
                  strategy: triggeringUsersAuthorizationStrategy      
      seed-job: |
        jobs:
          - script: |
              job('seed-job') {
                description('Job to generate pipeline for Django project')

                scm {
                  git {
                    remote {
                      url('https://github.com/ayri77/neoversity-devops-ci-cd-lab.git')
                    }
                    branches('*/lesson-8')
                  }
                }

                steps {
                  dsl {
                    text('''
                      pipelineJob('lesson-8-django-docker') {
                        description('Build and push the Django image to Amazon ECR')

                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('https://github.com/ayri77/neoversity-devops-ci-cd-lab.git')
                                }
                                branches('*/lesson-8')
                              }
                            }

                            scriptPath('Jenkinsfile')
                          }
                        }
                      }
                    ''')
                  }
                }

                configure { project ->
                  def dslStep = project.builders[0].'javaposse.jobdsl.plugin.ExecuteDslScripts'[0]
                  dslStep.appendNode('sandbox', true)
                }                
              }

persistence:
  enabled: true
  storageClass: "gp3"
  size: "10Gi"

agent:
  serviceAccount: jenkins-sa
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

serviceAccountAgent:
  create: false
  name: jenkins-sa