controller:
  admin:
    username: admin

  serviceType: LoadBalancer
  servicePort: 80
  targetPort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  additionalPlugins:
    - credentials-binding:latest
    - github:latest

persistence:
  enabled: true
  storageClass: ""
  size: "10Gi"