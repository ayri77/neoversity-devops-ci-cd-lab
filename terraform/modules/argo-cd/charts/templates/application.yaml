{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: {{ .project }}

  source:
{{ toYaml .source | nindent 4 }}

  destination:
{{ toYaml .destination | nindent 4 }}

  syncPolicy:
{{ toYaml .syncPolicy | nindent 4 }}
{{- end }}