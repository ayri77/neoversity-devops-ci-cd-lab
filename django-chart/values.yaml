replicaCount: 2

image:
  repository: 487337210313.dkr.ecr.eu-central-1.amazonaws.com/final-project-ecr
  tag: allowed-hosts
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  host: django.example.com
  path: /
  pathType: Prefix
  tls: false

existingSecret: django-app-secrets

config:
  ALLOWED_HOSTS: "localhost,127.0.0.1,*"
  DEBUG: "True"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
